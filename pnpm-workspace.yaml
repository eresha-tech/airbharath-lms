pmOnFail: warn
verifyDepsBeforeRun: false

# Next's Sharp 0.34.5 copy crashes on the local Linux runtime.
# Reuse the application's working Sharp version without disabling image optimization.
overrides:
  'next@15.5.19>sharp': 0.35.4

allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
